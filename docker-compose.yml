# Chronos local stack
#
# Default (ops + events):  docker compose up -d --build
# + second worker:         docker compose --profile scale up -d
# + analytics (M6+):       docker compose --profile analytics up -d
# Everything:              docker compose --profile scale --profile analytics up -d

name: chronos

x-app-env: &app-env
  CHRONOS_ENV: development
  CHRONOS_LOG_LEVEL: info
  CHRONOS_POSTGRES_DSN: postgres://chronos:chronos@postgres:5432/chronos?sslmode=disable
  CHRONOS_KAFKA_BROKERS: kafka:9092
  CHRONOS_QUEUE_BACKEND: kafka
  CHRONOS_QUEUE_KAFKA_TOPIC: chronos.jobs
  CHRONOS_QUEUE_KAFKA_GROUP: chronos-scheduler
  CHRONOS_API_KEYS: dev-api-key-change-me
  CHRONOS_WORKER_TOKENS: dev-worker-token-change-me
  CHRONOS_KAFKA_JOB_EVENTS_TOPIC: chronos.job-events
  CHRONOS_KAFKA_WORKER_EVENTS_TOPIC: chronos.worker-events
  CHRONOS_KAFKA_SCHEDULER_EVENTS_TOPIC: chronos.scheduler-events

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      <<: *app-env
      CHRONOS_API_HTTP_ADDR: ":8080"
      # Analytics optional — works when ClickHouse profile is up
      CHRONOS_CLICKHOUSE_DSN: clickhouse://chronos:chronos@clickhouse:9000/chronos
      CHRONOS_CLICKHOUSE_DATABASE: chronos
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      args:
        SERVICE: scheduler
    environment:
      <<: *app-env
      CHRONOS_SCHEDULER_ID: scheduler-1
      CHRONOS_SCHEDULER_LISTEN_ADDR: ":9091"
      CHRONOS_SCHEDULER_ADVERTISE_ADDR: scheduler:9091
      CHRONOS_QUEUE_KAFKA_GROUP: chronos-scheduler
    ports:
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      <<: *app-env
      CHRONOS_WORKER_LISTEN_ADDR: ":9092"
      CHRONOS_WORKER_ADVERTISE_ADDR: worker:9092
      CHRONOS_SCHEDULER_ADDR: scheduler:9091
      CHRONOS_WORKER_CAPACITY: "10"
      CHRONOS_WORKER_ID: worker-1
    depends_on:
      scheduler:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
      args:
        SERVICE: outbox-publisher
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    profiles: ["scale"]
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      <<: *app-env
      CHRONOS_WORKER_LISTEN_ADDR: ":9092"
      CHRONOS_WORKER_ADVERTISE_ADDR: worker-2:9092
      CHRONOS_SCHEDULER_ADDR: scheduler:9091
      CHRONOS_WORKER_CAPACITY: "10"
      CHRONOS_WORKER_ID: worker-2
    depends_on:
      scheduler:
        condition: service_started
    restart: unless-stopped

  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: chronos
      CLICKHOUSE_USER: chronos
      CLICKHOUSE_PASSWORD: chronos
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  analytics-consumer:
    profiles: ["analytics"]
    build:
      context: .
      args:
        SERVICE: analytics-consumer
    environment:
      <<: *app-env
      CHRONOS_CLICKHOUSE_DSN: clickhouse://chronos:chronos@clickhouse:9000/chronos
      CHRONOS_CLICKHOUSE_DATABASE: chronos
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["analytics"]
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["analytics"]
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: chronos
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - clickhouse
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  grafana_data:
